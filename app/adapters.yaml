# 适配器注册表。Phase 1 只含 R1 hagb 家族(EC/aTrust)。
# env 值里的 {mac}/{vnc_password}/{version} 由 RuntimeHagb 运行时替换。
adapters:
  easyconnect:
    label: EasyConnect
    desc: 深信服 EasyConnect
    runtime: hagb
    dns_recovery_tun: tun0
    image: "hagb/docker-easyconnect:{version}"
    versioned: true
    version_repo: hagb/docker-easyconnect
    fallback_versions: ["7.6.3", "7.6.7"]
    arch: [amd64, arm64]
    login_modes: [headless, gui]
    inputs:
      - {key: server,   label: 网关地址, type: url}
      - {key: username, label: 账号,     type: text}
      - {key: password, label: 密码,     type: password, secret: true}
    env:
      USE_NOVNC: "1"
      PASSWORD: "{vnc_password}"
      EXIT: ""
      FAKE_HWADDR: "{mac}"
      EC_VER: "{version}"
      DISABLE_PKG_VERSION_XML: "1"
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {}

  atrust:
    label: aTrust
    desc: 深信服 aTrust，在登录窗口手动登录
    runtime: hagb
    dns_recovery_tun: utun7
    image: "hagb/docker-atrust:latest"   # 上游无版本 tag(只有 latest/vncless)
    versioned: false
    arch: [amd64, arm64]
    login_modes: [gui]
    inputs:
      - {key: server,   label: 网关地址, type: url}
    env:
      USE_NOVNC: "1"
      PASSWORD: "{vnc_password}"
      EXIT: ""
      FAKE_HWADDR: "{mac}"
      DISABLE_PKG_VERSION_XML: "1"
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.conf.default.route_localnet": "1"}

  # ── R2 oss 无头家族(共用自建镜像 vpnmgr/oss-vpn:latest)──
  # 密钥经 stdin/临时文件注入容器,绝不进命令行(命门 #5)。无 noVNC。
  anyconnect:
    label: Cisco AnyConnect
    desc: Cisco AnyConnect，账号密码自动登录
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: anyconnect
    inputs:
      - {key: server,   label: 网关地址, type: url,      required: true}
      - {key: username, label: 账号,     type: text,     required: true}
      - {key: password, label: 密码,     type: password, secret: true}
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.ip_forward": "1"}

  globalprotect:
    label: GlobalProtect
    desc: Palo Alto GlobalProtect，账号密码自动登录（不支持 SAML / SSO）
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: gp
    inputs:
      - {key: server,   label: 网关地址, type: url,      required: true}
      - {key: username, label: 账号,     type: text,     required: true}
      - {key: password, label: 密码,     type: password, secret: true}
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.ip_forward": "1"}

  fortinet-oc:
    label: Fortinet (openconnect)
    desc: Fortinet SSL VPN（openconnect），账号密码自动登录
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: fortinet
    inputs:
      - {key: server,   label: 网关地址, type: url,      required: true}
      - {key: username, label: 账号,     type: text,     required: true}
      - {key: password, label: 密码,     type: password, secret: true}
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.ip_forward": "1"}

  juniper:
    label: Juniper / Pulse (nc)
    desc: Juniper Network Connect，账号密码自动登录
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: nc
    inputs:
      - {key: server,   label: 网关地址, type: url,      required: true}
      - {key: username, label: 账号,     type: text,     required: true}
      - {key: password, label: 密码,     type: password, secret: true}
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.ip_forward": "1"}

  pulse:
    label: Pulse / Ivanti
    desc: Pulse / Ivanti Secure，账号密码自动登录
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: pulse
    inputs:
      - {key: server,   label: 网关地址, type: url,      required: true}
      - {key: username, label: 账号,     type: text,     required: true}
      - {key: password, label: 密码,     type: password, secret: true}
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.ip_forward": "1"}

  openfortivpn:
    label: openfortivpn
    desc: Fortinet SSL VPN（openfortivpn），账号密码自动登录
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: openfortivpn
    inputs:
      - {key: server,   label: 网关地址, type: text,     required: true}
      - {key: username, label: 账号,     type: text,     required: true}
      - {key: password, label: 密码,     type: password, secret: true}
    caps: [NET_ADMIN, MKNOD]                  # MKNOD:entrypoint 建 /dev/ppp(pppd 用)
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    device_cgroup_rules: ["c 108:* rwm"]      # 放行 PPP 字符设备 major 108(否则打不开 /dev/ppp)
    sysctls: {"net.ipv4.ip_forward": "1"}

  openvpn:
    label: OpenVPN
    desc: 上传 .ovpn 配置文件，可选账号密码
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: openvpn
    inputs:
      - {key: config_file, label: .ovpn 配置, type: file,     required: true, secret: true}
      - {key: username,    label: 账号(可选), type: text}
      - {key: password,    label: 密码(可选), type: password, secret: true}
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.ip_forward": "1"}

  wireguard:
    label: WireGuard
    desc: 上传 WireGuard .conf 配置文件
    runtime: oss
    image: "vpnmgr/oss-vpn:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [headless]
    protocol: wireguard
    inputs:
      - {key: config_file, label: wg .conf, type: file, required: true, secret: true}
    caps: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {"net.ipv4.ip_forward": "1"}
  # strongSwan / IKEv2 推迟到后续:纯 IPsec 无具名 tun,dante 难以 pin egress;
  # 需 route-based VTI/XFRMi 才能可靠 SOCKS-egress。本阶段不收。

  # ── R3 byo 兜底家族(自建桌面镜像 vpnmgr/byo-desktop:latest)──
  # 一台带 tun+SOCKS5 的 Linux 桌面,用户经 noVNC 手动装任意 VPN GUI 客户端并登录。
  # 不注入凭据(无 connect);登录成功唯一判据仍是 SOCKS5 探活(命门 #1)。尽力而为。
  custom:
    label: 自定义 / BYO
    desc: 自带客户端：在远程桌面里自行安装任意 Linux VPN 客户端
    runtime: byo
    image: "vpnmgr/byo-desktop:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [byo]
    inputs:
      - {key: package, label: "安装包(可选,.deb/.rpm/.run/.AppImage)", type: file, required: false}
    env:
      USE_NOVNC: "1"
      PASSWORD: "{vnc_password}"
    caps: [NET_ADMIN, MKNOD]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {}
    # 容器解析器策略(写进初始 resolv.conf 的 options,= docker --dns-opt;两栈同源)。
    # 第三方 GUI 客户端登录后常把 DNS 换成自带代理(Hillstone 实测:只答 A、AAAA 丢包,
    # glibc 双栈查询等到超时 → 按域名走 SOCKS5 必败、按 IP 正常)。企业内网为纯 IPv4,
    # no-aaaa 让 glibc 只发 A 查询即修;是 run 参数而非镜像改动,客户端追加 nameserver 时保留。
    dns_opts: [no-aaaa]

  # ── byo 家族专用成员:Hillstone Secure Connect(山石网科 SSL VPN / ZTNA)──
  # 官方只出 x86_64 Linux 客户端(Qt GUI + root 守护进程),无开源实现可用
  # (openconnect 不支持;hilldust 为 2022 停更 PoC 且只有 3DES)。自建镜像
  # vpnmgr/hillstone-desktop(images/hillstone/)预装客户端:镜像按宿主原生架构构建
  # (桌面/VNC 栈原生),只有 Hillstone 两个 x86_64 二进制在 arm64 宿主上经 binfmt 转译,
  # 依赖库走 Debian multiarch :amd64 —— 与 aTrust「必须原生 arm64」不同,这里没有原生可选。
  # 登录仍经 noVNC 在客户端窗口手填(账号密码 / 短信 / 证书),判据只认 SOCKS5 探活(命门 #1)。
  hillstone:
    label: Hillstone Secure Connect
    desc: 山石网科 Secure Connect，已预装客户端，在登录窗口手动登录
    notice: >-
      容器已预装 Hillstone Secure Connect 官方 Linux 客户端(5.7.x,x86_64)。
      起容器后在登录窗口里填网关地址(host:port)、账号密码,按需完成短信/证书验证;
      客户端记住的网关落在数据卷,重建通道不丢。官方无 arm64 构建,Apple Silicon 上客户端本身
      经转译运行(桌面与 VNC 栈原生),GUI 响应稍慢。登录成功最终只认 SOCKS5 探活。
    runtime: byo
    image: "vpnmgr/hillstone-desktop:latest"
    versioned: false
    arch: [amd64, arm64]
    login_modes: [byo]
    inputs: []
    env:
      USE_NOVNC: "1"
      PASSWORD: "{vnc_password}"
    caps: [NET_ADMIN, MKNOD]
    devices: ["/dev/net/tun:/dev/net/tun:rwm"]
    sysctls: {}
    dns_opts: [no-aaaa]   # 守护进程 DNS 代理丢 AAAA(见 custom 注释),2026-09-09 实测
