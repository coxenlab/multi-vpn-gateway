<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流量监控 · VPN 管理网关</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* 屏内独有样式 —— 仅用 var(--*) 或与 black/white/transparent 的 color-mix */

    /* ─── 紧凑指标带：一行四格，日志流才是主角，这里只做瘦身读数 ─── */
    .mband { display: grid; grid-template-columns: repeat(4, 1fr); }
    .mcell { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-left: 1px solid var(--border); min-width: 0; }
    .mcell:first-child { border-left: 0; }
    .mcell .mk { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--muted); white-space: nowrap; }
    .mcell .mk svg { width: 13px; height: 13px; flex: none; }
    .mcell .mvv { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-base); font-weight: 600; white-space: nowrap; }
    .mcell .mvv .u { margin-left: 3px; font-size: var(--text-xs); font-weight: 400; color: var(--muted); }

    /* ─── 工具条 ─── */
    .log-tools { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--border); }
    .log-tools .select, .log-tools .input { width: auto; }
    .log-tools .t-chan { min-width: 168px; }
    .log-tools .t-re { flex: 1; min-width: 180px; font-family: var(--font-mono); font-size: var(--text-xs); }
    .log-tools .t-re.is-bad { border-color: var(--danger); }
    .log-tools .t-hint { font-size: var(--text-xs); color: var(--warn); white-space: nowrap; }
    /* .tag/.btn 在 app.css 里显式写了 display，会盖掉 UA 的 [hidden]{display:none}，须补回 */
    #log-state[hidden], .log-tools .t-hint[hidden] { display: none; }
    .log-tools .t-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 var(--space-1); }

    /* ─── 日志流：浅底（白 surface）等宽行密，对齐 Clash Verge 浅色模式的日志页。
     * 规则：短的嵌入式输出（.code / noVNC 舞台）留深色终端块；这种撑满整屏的
     * 主内容日志面用浅底 —— 一块 800px 高的黑面压在奶油底页面上会喧宾夺主。 ─── */
    .log-wrap { position: relative; }
    .log-view {
      height: clamp(340px, calc(100vh - 420px), 820px);
      overflow: auto;
      padding: var(--space-3) 0;
      background: var(--surface); color: var(--fg);
      font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.75;
    }
    .log-row { display: flex; gap: var(--space-3); padding: 0 var(--space-5); }
    .log-row:hover { background: var(--row-hover); }
    .lg-seq { flex: none; min-width: 3.2em; text-align: right; color: color-mix(in oklab, var(--muted), transparent 35%); }
    .lg-ts  { flex: none; color: var(--muted); }
    .lg-msg { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
    .lg-net { color: color-mix(in oklab, var(--muted), transparent 15%); }
    .lg-kw  { color: var(--muted); }         /* --> / match / using */
    .lg-src { color: var(--muted); }
    .lg-dst { color: var(--fg); }
    .lg-pl  { color: var(--accent); }        /* 命中的 rulePayload —— 本屏唯一强调 */
    .lg-via { color: var(--fg); }
    /* 末跳非 ch-*（DIRECT/REJECT 等兜底）：整行压到 muted，与走通道的行拉开层次 */
    .log-row.is-direct .lg-msg,
    .log-row.is-direct .lg-dst,
    .log-row.is-direct .lg-via { color: var(--muted); }

    .log-empty { padding: var(--space-8) var(--space-5); text-align: center; color: var(--muted); font-family: var(--font-body); font-size: var(--text-sm); }
    .log-skel { padding: var(--space-4) var(--space-5); }

    /* 用户上滚脱离跟随时出现 */
    .log-jump { position: absolute; right: var(--space-5); bottom: var(--space-4); box-shadow: var(--elev-raised); }
    .log-jump[hidden] { display: none; }

    /* ─── 遥测更新状态 pill ─── */
    #feed-pill .dot { transition: background var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard); }
    #feed-pill.is-live .dot { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    #feed-pill.is-down .dot { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    #feed-pill #feed-text { transition: color var(--motion-fast) var(--ease-standard); }
    #feed-pill.is-down #feed-text { color: var(--danger); }

    @media (max-width: 920px) {
      .mband { grid-template-columns: repeat(2, 1fr); }
      .mcell:nth-child(3) { border-left: 0; }
      .mcell:nth-child(n+3) { border-top: 1px solid var(--border); }
      .log-view { height: clamp(300px, calc(100vh - 460px), 640px); }
    }
    @media (max-width: 600px) {
      .mband { grid-template-columns: 1fr; }
      .mcell { border-left: 0; border-top: 1px solid var(--border); }
      .mcell:first-child { border-top: 0; }
      .log-tools .t-chan, .log-tools .t-re { min-width: 0; width: 100%; flex: 1 1 100%; }
      .log-tools .t-sep { display: none; }
      .log-row { gap: var(--space-2); padding: 0 var(--space-3); }
      .lg-seq { display: none; }
    }
  </style>
</head>
<body data-page="monitor">
  <div class="app">
    <aside class="sidebar"></aside>

    <!-- ════ 主区 ════ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>流量监控</h1>
        <span class="spacer"></span>
        <span class="sys-chip" id="feed-pill" title="遥测数据更新状态"><span class="dot"></span><span id="feed-text">连接中…</span></span>
      </header>

      <div class="content stack-6">
        <!-- 反馈层错误条挂载点（仅故障时填充，平时为空、不占视觉） -->
        <div id="feed-error"></div>

        <!-- ── 紧凑指标带 ── -->
        <div class="card mband" data-od-id="metrics">
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              实时上行
            </span>
            <span class="mvv"><span id="m-up">—</span><span class="u" id="m-up-u">KB/s</span></span>
          </div>
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
              实时下行
            </span>
            <span class="mvv"><span id="m-down">—</span><span class="u" id="m-down-u">KB/s</span></span>
          </div>
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M5 12a7 7 0 017-7M19 12a7 7 0 01-7 7"/><circle cx="12" cy="12" r="2"/></svg>
              活跃连接
            </span>
            <span class="mvv"><span id="m-conn">—</span><span class="u">条</span></span>
          </div>
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
              在线通道
            </span>
            <span class="mvv">
              <!-- 半圆弧仪表(blume 形态,纯装饰):左红→右绿三段弧 + 指针指向在线率。
                   数据仍以右侧数字为准;弧段用语义色 soft 档,指针用 --fg。 -->
              <svg id="m-gauge" viewBox="0 0 44 24" aria-hidden="true" style="width:38px;height:21px;flex:none;align-self:center;">
                <path d="M4 21 A18 18 0 0 1 12.4 5.8"  fill="none" stroke="var(--danger-soft)"  stroke-width="5" stroke-linecap="round"/>
                <path d="M14.9 4.5 A18 18 0 0 1 29.1 4.5" fill="none" stroke="var(--warn-soft)" stroke-width="5" stroke-linecap="round"/>
                <path d="M31.6 5.8 A18 18 0 0 1 40 21"  fill="none" stroke="var(--success-soft)" stroke-width="5" stroke-linecap="round"/>
                <g id="m-needle" style="transform-origin:22px 21px;transition:transform 400ms var(--ease-standard);transform:rotate(0deg);">
                  <line x1="22" y1="21" x2="22" y2="8" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round" transform="rotate(-90 22 21)"/>
                </g>
                <circle cx="22" cy="21" r="2.2" fill="var(--coral)"/>
              </svg>
              <span id="m-nodes">—</span><span class="u" id="m-nodes-u">/ —</span></span>
          </div>
        </div>

        <!-- ── 路由决策日志流（主角） ── -->
        <div class="card" data-od-id="log">
          <div class="card-head">
            <h3>连接记录</h3>
            <span class="row">
              <span class="tag" id="log-state" hidden>已暂停</span>
              <span class="t-xs muted">缓冲 <span class="num" id="log-count">0</span> / 500</span>
            </span>
          </div>

          <div class="log-tools">
            <select class="select t-chan" id="f-chan" aria-label="按出口筛选">
              <option value="all">全部通道</option>
            </select>
            <input class="input t-re" id="f-re" type="search" placeholder="搜索域名、IP 或通道" aria-label="正则搜索" />
            <span class="t-hint" id="re-hint" hidden>正则无效 · 已按原文匹配</span>
            <span class="t-sep"></span>
            <button class="btn btn-secondary btn-sm" id="btn-pause" type="button">
              <svg id="pause-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5v14M15 5v14"/></svg>
              <span id="pause-label">暂停</span>
            </button>
            <button class="btn btn-ghost btn-sm" id="btn-clear" type="button">清空</button>
            <button class="btn btn-ghost btn-sm" id="btn-export" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></svg>
              导出 .log
            </button>
          </div>

          <div class="log-wrap">
            <div class="log-view" id="log-view" tabindex="0" role="log" aria-live="off" aria-label="路由决策日志"></div>
            <button class="btn btn-secondary btn-sm log-jump" id="log-jump" type="button" hidden>↓ 跟随最新</button>
          </div>

          <div class="card-foot">
            <span class="t-xs muted">每条新连接一行：来源 → 目标，命中了哪条规则，走了哪条通道。<span class="mono">DIRECT</span> 表示未命中规则、直接联网。</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/monitor.js"></script>
</body>
</html>
