<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>流量监控 · VPN 管理网关</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* 屏内独有样式 —— 仅用 var(--*) 或与 black/white/transparent 的 color-mix */

    /* ─── 紧凑指标带：一行四格，日志流才是主角，这里只做瘦身读数 ─── */
    .mband { display: grid; grid-template-columns: repeat(4, 1fr); }
    .mcell { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-3) var(--space-5); border-left: 1px solid var(--border); min-width: 0; }
    .mcell:first-child { border-left: 0; }
    .mcell .mk { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--muted); white-space: nowrap; }
    .mcell .mk svg { width: 13px; height: 13px; flex: none; }
    .mcell .mvv { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-base); font-weight: 600; white-space: nowrap; }
    .mcell .mvv .u { margin-left: 3px; font-size: var(--text-xs); font-weight: 400; color: var(--muted); }

    /* ─── 工具条 ─── */
    .log-tools { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--border); }
    .log-tools .select, .log-tools .input { width: auto; }
    .log-tools .t-chan { min-width: 168px; }
    .log-tools .t-re { flex: 1; min-width: 180px; font-family: var(--font-mono); font-size: var(--text-xs); }
    .log-tools .t-re.is-bad { border-color: var(--danger); }
    .log-tools .t-hint { font-size: var(--text-xs); color: var(--warn); white-space: nowrap; }
    /* .tag/.btn 在 app.css 里显式写了 display，会盖掉 UA 的 [hidden]{display:none}，须补回 */
    #log-state[hidden], .log-tools .t-hint[hidden] { display: none; }
    .log-tools .t-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 var(--space-1); }

    /* ─── 日志流：浅底（白 surface）等宽行密，对齐 Clash Verge 浅色模式的日志页。
     * 规则：短的嵌入式输出（.code / noVNC 舞台）留深色终端块；这种撑满整屏的
     * 主内容日志面用浅底 —— 一块 800px 高的黑面压在奶油底页面上会喧宾夺主。 ─── */
    .log-wrap { position: relative; }
    .log-view {
      height: clamp(340px, calc(100vh - 420px), 820px);
      overflow: auto;
      padding: var(--space-3) 0;
      background: var(--surface); color: var(--fg);
      font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.75;
    }
    .log-row { display: flex; gap: var(--space-3); padding: 0 var(--space-5); }
    .log-row:hover { background: var(--row-hover); }
    .lg-seq { flex: none; min-width: 3.2em; text-align: right; color: color-mix(in oklab, var(--muted), transparent 35%); }
    .lg-ts  { flex: none; color: var(--muted); }
    .lg-msg { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
    .lg-net { color: color-mix(in oklab, var(--muted), transparent 15%); }
    .lg-kw  { color: var(--muted); }         /* --> / match / using */
    .lg-src { color: var(--muted); }
    .lg-dst { color: var(--fg); }
    .lg-pl  { color: var(--accent); }        /* 命中的 rulePayload —— 本屏唯一强调 */
    .lg-via { color: var(--fg); }
    /* 末跳非 ch-*（DIRECT/REJECT 等兜底）：整行压到 muted，与走通道的行拉开层次 */
    .log-row.is-direct .lg-msg,
    .log-row.is-direct .lg-dst,
    .log-row.is-direct .lg-via { color: var(--muted); }

    .log-empty { padding: var(--space-8) var(--space-5); text-align: center; color: var(--muted); font-family: var(--font-body); font-size: var(--text-sm); }
    .log-skel { padding: var(--space-4) var(--space-5); }

    /* 用户上滚脱离跟随时出现 */
    .log-jump { position: absolute; right: var(--space-5); bottom: var(--space-4); box-shadow: var(--elev-raised); }
    .log-jump[hidden] { display: none; }

    /* ─── 遥测更新状态 pill ─── */
    #feed-pill .dot { transition: background var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard); }
    #feed-pill.is-live .dot { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    #feed-pill.is-down .dot { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    #feed-pill #feed-text { transition: color var(--motion-fast) var(--ease-standard); }
    #feed-pill.is-down #feed-text { color: var(--danger); }

    @media (max-width: 920px) {
      .mband { grid-template-columns: repeat(2, 1fr); }
      .mcell:nth-child(3) { border-left: 0; }
      .mcell:nth-child(n+3) { border-top: 1px solid var(--border); }
      .log-view { height: clamp(300px, calc(100vh - 460px), 640px); }
    }
    @media (max-width: 600px) {
      .mband { grid-template-columns: 1fr; }
      .mcell { border-left: 0; border-top: 1px solid var(--border); }
      .mcell:first-child { border-top: 0; }
      .log-tools .t-chan, .log-tools .t-re { min-width: 0; width: 100%; flex: 1 1 100%; }
      .log-tools .t-sep { display: none; }
      .log-row { gap: var(--space-2); padding: 0 var(--space-3); }
      .lg-seq { display: none; }
    }
  </style>
</head>
<body data-page="monitor">
  <div class="app">
    <aside class="sidebar"></aside>

    <!-- ════ 主区 ════ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>流量监控</h1>
        <span class="spacer"></span>
        <span class="sys-chip" id="feed-pill" title="遥测数据更新状态"><span class="dot"></span><span id="feed-text">连接中…</span></span>
      </header>

      <div class="content stack-6">
        <!-- 反馈层错误条挂载点（仅故障时填充，平时为空、不占视觉） -->
        <div id="feed-error"></div>

        <!-- ── 紧凑指标带 ── -->
        <div class="card mband" data-od-id="metrics">
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              实时上行
            </span>
            <span class="mvv"><span id="m-up">—</span><span class="u" id="m-up-u">KB/s</span></span>
          </div>
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
              实时下行
            </span>
            <span class="mvv"><span id="m-down">—</span><span class="u" id="m-down-u">KB/s</span></span>
          </div>
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M5 12a7 7 0 017-7M19 12a7 7 0 01-7 7"/><circle cx="12" cy="12" r="2"/></svg>
              活跃连接
            </span>
            <span class="mvv"><span id="m-conn">—</span><span class="u">条</span></span>
          </div>
          <div class="mcell">
            <span class="mk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
              在线通道
            </span>
            <span class="mvv">
              <!-- 半圆弧仪表(blume 形态,纯装饰):左红→右绿三段弧 + 指针指向在线率。
                   数据仍以右侧数字为准;弧段用语义色 soft 档,指针用 --fg。 -->
              <svg id="m-gauge" viewBox="0 0 44 24" aria-hidden="true" style="width:38px;height:21px;flex:none;align-self:center;">
                <path d="M4 21 A18 18 0 0 1 12.4 5.8"  fill="none" stroke="var(--danger-soft)"  stroke-width="5" stroke-linecap="round"/>
                <path d="M14.9 4.5 A18 18 0 0 1 29.1 4.5" fill="none" stroke="var(--warn-soft)" stroke-width="5" stroke-linecap="round"/>
                <path d="M31.6 5.8 A18 18 0 0 1 40 21"  fill="none" stroke="var(--success-soft)" stroke-width="5" stroke-linecap="round"/>
                <g id="m-needle" style="transform-origin:22px 21px;transition:transform 400ms var(--ease-standard);transform:rotate(0deg);">
                  <line x1="22" y1="21" x2="22" y2="8" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round" transform="rotate(-90 22 21)"/>
                </g>
                <circle cx="22" cy="21" r="2.2" fill="var(--coral)"/>
              </svg>
              <span id="m-nodes">—</span><span class="u" id="m-nodes-u">/ —</span></span>
          </div>
        </div>

        <!-- ── 路由决策日志流（主角） ── -->
        <div class="card" data-od-id="log">
          <div class="card-head">
            <h3>连接记录</h3>
            <span class="row">
              <span class="tag" id="log-state" hidden>已暂停</span>
              <span class="t-xs muted">缓冲 <span class="num" id="log-count">0</span> / 500</span>
            </span>
          </div>

          <div class="log-tools">
            <select class="select t-chan" id="f-chan" aria-label="按出口筛选">
              <option value="all">全部通道</option>
            </select>
            <input class="input t-re" id="f-re" type="search" placeholder="搜索域名、IP 或通道" aria-label="正则搜索" />
            <span class="t-hint" id="re-hint" hidden>正则无效 · 已按原文匹配</span>
            <span class="t-sep"></span>
            <button class="btn btn-secondary btn-sm" id="btn-pause" type="button">
              <svg id="pause-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5v14M15 5v14"/></svg>
              <span id="pause-label">暂停</span>
            </button>
            <button class="btn btn-ghost btn-sm" id="btn-clear" type="button">清空</button>
            <button class="btn btn-ghost btn-sm" id="btn-export" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></svg>
              导出 .log
            </button>
          </div>

          <div class="log-wrap">
            <div class="log-view" id="log-view" tabindex="0" role="log" aria-live="off" aria-label="路由决策日志"></div>
            <button class="btn btn-secondary btn-sm log-jump" id="log-jump" type="button" hidden>↓ 跟随最新</button>
          </div>

          <div class="card-foot">
            <span class="t-xs muted">每条新连接一行：来源 → 目标，命中了哪条规则，走了哪条通道。<span class="mono">DIRECT</span> 表示未命中规则、直接联网。</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/feedback.js"></script>
  <script>
    /* ═══ 路由决策日志流 ═══
     * 数据源只有既有的 /api/connections + /api/proxies（无新后端接口）：
     * 每 1.5s 拉一次 connections，对 connections[].id 做集合差分，
     * 新出现的 id 合成一行 Clash 风格日志。连接结束后 id 不再复用，
     * 因此每帧把「已记录集合」直接重置为当前活跃 id 集合即可，内存恒定。 */

    const MAX_LINES = 500;                 // 环形缓冲上限

    let chs = [], sys = {}, nodes = [];
    let prevTotals = null, prevTs = null;  // 速率差分锚点（沿用旧页算法）
    let pollTimer = null, feedDown = false, booted = false;

    let seen = new Set();   // 已记录过日志的 connection id（= 上一帧的活跃集合）
    let buf = [];           // 环形缓冲：日志条目对象
    let pending = [];       // 暂停期间挂起的条目（恢复后按序补入）
    let seq = 0;            // 全局行号
    let paused = false, follow = true;
    let filterChan = "all", filterQ = "", filterRe = null, chanSig = "";


    const PAUSE_IC = '<path d="M9 5v14M15 5v14"/>';
    const PLAY_IC  = '<path d="M7 4l13 8-13 8V4z"/>';

    /* ───────── 反馈层状态：遥测更新 pill + 故障错误条(单条、自愈即清) ───────── */
    function setFeed(state, text) {
      const pill = $("#feed-pill");
      pill.classList.toggle("is-live", state === "live");
      pill.classList.toggle("is-down", state === "down");
      $("#feed-text").textContent = text;
    }
    function pad2(n) { return String(n).padStart(2, "0"); }
    function hhmmss(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
    function nowHHMMSS() { return hhmmss(new Date()); }
    function clearFeedError() {
      if (!feedDown) return;
      feedDown = false;
      $("#feed-error").innerHTML = "";
    }
    function showFeedError(e, onRetry) {
      // 同一故障只渲染一条错误条,避免每 1.5s 刷屏
      if (feedDown) return;
      feedDown = true;
      $("#feed-error").innerHTML = "";
      if (window.fb && fb.errorBanner) {
        // 点「重试」时 fb 先 remove 自身;须放开 feedDown,使再次失败能重渲一条新错误条
        fb.errorBanner("#feed-error", {
          fromError: e, retryLabel: "重试",
          onRetry: () => { feedDown = false; onRetry(); },
        });
      }
    }

    /* 首屏占位骨架(仅未成功渲染过时) */
    function showInitialSkeleton() {
      if (booted || !(window.fb && fb.skeleton)) return;
      const box = document.createElement("div");
      box.className = "log-skel";
      box.appendChild(fb.skeleton(8));
      $("#log-view").innerHTML = "";
      $("#log-view").appendChild(box);
    }

    async function boot() {
      // 初始化-获取系统配置:进行中提示(loading pill + 首屏骨架)
      setFeed("loading", "连接中…");
      showInitialSkeleton();
      $("#feed-error").innerHTML = ""; feedDown = false;
      try {
        sys = await api.system();
      } catch (e) {
        // 失败:友好错误条 + 带操作的 toast,重试重跑 boot(同一 api,参数不变)
        setFeed("down", "连接失败");
        feedDown = true;
        if (window.fb && fb.errorBanner)
          fb.errorBanner("#feed-error", { fromError: e, onRetry: boot, retryLabel: "重新连接" });
        toast("无法连接遥测,数据未加载", { variant: "danger", action: { label: "重试", onClick: boot } });
        return;
      }
      $("#foot-port").textContent = ":" + sys.mihomo_port;
      // 先起轮询(只起一次)再拉首帧 —— 即便首帧失败,后续仍会每 1.5s 自动重试自愈
      if (!pollTimer) pollTimer = setInterval(tick, 1500);
      await tick();
    }
    function chanName(id) { const c = chs.find(x => x.id === id); return c ? c.name : "未知通道"; }

    /* ───────── 日志条目合成 ─────────
     * 出口取 chains 里的 ch-* 项：本工具的通道在 mihomo 里就是 ch-{id} 代理，
     * chains 末项即它；若上游把分流口(vpn-router)也串进 chains，则末项不是 ch-*，
     * 这里退一步在整条链里找 ch-*，找不到再退回末项（DIRECT/REJECT 等兜底）。 */
    function outbound(chains) {
      const arr = Array.isArray(chains) ? chains : [];
      const hit = arr.find(x => typeof x === "string" && x.indexOf("ch-") === 0);
      if (hit) return hit;
      return arr.length ? String(arr[arr.length - 1] || "") : "";
    }
    function tsOf(c) {
      const d = c.start ? new Date(c.start) : null;
      return d && !isNaN(d.getTime()) ? hhmmss(d) : nowHHMMSS();
    }
    function makeEntry(c) {
      const m = c.metadata || {};
      const net = String(m.network || "tcp").toUpperCase();
      const src = (m.sourceIP || "?") + (m.sourcePort ? ":" + m.sourcePort : "");
      const dst = (m.host || m.destinationIP || "?") + (m.destinationPort ? ":" + m.destinationPort : "");
      const tail = outbound(c.chains);
      const cid = tail.indexOf("ch-") === 0 ? tail.slice(3) : null;
      const rule = c.rule || "Match";
      const payload = c.rulePayload || "";
      const via = cid ? tail + "[" + chanName(cid) + "]" : (tail || "DIRECT");
      const e = {
        seq: 0, ts: tsOf(c), net, src, dst, rule, payload, tail, via,
        direct: !cid,   // 末跳非 ch-* ＝ 未经本工具通道（DIRECT / REJECT 兜底）
      };
      // 纯文本形态：既供正则搜索，也供导出 .log
      e.text = "[" + net + "] " + src + " --> " + dst + " match " + rule +
               (payload ? "(" + payload + ")" : "") + " using " + via;
      e.search = e.ts + " " + e.text;
      return e;
    }

    function rowHTML(e) {
      const rule = e.payload
        ? fb.esc(e.rule) + "(<span class=\"lg-pl\">" + fb.esc(e.payload) + "</span>)"
        : fb.esc(e.rule);
      return '<div class="log-row' + (e.direct ? " is-direct" : "") + '" data-seq="' + e.seq + '">' +
        '<span class="lg-seq">' + String(e.seq).padStart(4, "0") + "</span>" +
        '<span class="lg-ts">' + fb.esc(e.ts) + "</span>" +
        '<span class="lg-msg">' +
          '<span class="lg-net">[' + fb.esc(e.net) + "]</span> " +
          '<span class="lg-src">' + fb.esc(e.src) + "</span> " +
          '<span class="lg-kw">--&gt;</span> ' +
          '<span class="lg-dst">' + fb.esc(e.dst) + "</span> " +
          '<span class="lg-kw">match</span> ' + rule + " " +
          '<span class="lg-kw">using</span> ' +
          '<span class="lg-via">' + fb.esc(e.via) + "</span>" +
        "</span></div>";
    }

    /* ───────── 筛选（出口下拉 + 正则搜索） ───────── */
    function matchEntry(e) {
      if (filterChan === "direct" && !e.direct) return false;
      if (filterChan !== "all" && filterChan !== "direct" && e.tail !== filterChan) return false;
      if (!filterQ) return true;
      if (filterRe) { filterRe.lastIndex = 0; return filterRe.test(e.search); }
      return e.search.toLowerCase().indexOf(filterQ.toLowerCase()) !== -1;
    }
    function filterDesc() {
      const chan = filterChan === "all" ? "全部通道" : filterChan === "direct" ? "DIRECT" : filterChan;
      return chan + (filterQ ? " · /" + filterQ + "/" : "");
    }
    function readFilters() {
      filterChan = $("#f-chan").value || "all";
      filterQ = $("#f-re").value.trim();
      filterRe = null;
      let bad = false;
      if (filterQ) {
        try { filterRe = new RegExp(filterQ, "i"); }
        catch (_) { filterRe = null; bad = true; }   // 正则写坏了不报错，降级成原文包含匹配
      }
      $("#f-re").classList.toggle("is-bad", bad);
      $("#re-hint").hidden = !bad;
    }

    /* ───────── 视图维护（环形缓冲 → DOM，增量 append + 头部裁剪） ───────── */
    function view() { return $("#log-view"); }
    function removeEmpty() { const ph = $("#log-empty"); if (ph) ph.remove(); }
    function syncEmpty() {
      const v = view();
      if (v.querySelector(".log-row")) { removeEmpty(); return; }
      if ($("#log-empty")) return;
      const d = document.createElement("div");
      d.className = "log-empty";
      d.id = "log-empty";
      d.textContent = buf.length
        ? "当前筛选下没有匹配的日志行"
        : "等待新连接…";
      v.innerHTML = "";
      v.appendChild(d);
    }
    function trimDom() {
      const v = view();
      const oldest = buf.length ? buf[0].seq : Infinity;
      let first = v.querySelector(".log-row");
      while (first && Number(first.dataset.seq) < oldest) {
        first.remove();
        first = v.querySelector(".log-row");
      }
    }
    function scrollBottom() { const v = view(); v.scrollTop = v.scrollHeight; }
    function syncCount() { $("#log-count").textContent = buf.length; }

    function appendEntries(list) {
      if (!list.length) return;
      list.forEach(e => { e.seq = ++seq; buf.push(e); });
      if (buf.length > MAX_LINES) buf.splice(0, buf.length - MAX_LINES);
      const html = list.filter(matchEntry).map(rowHTML).join("");
      if (html) { removeEmpty(); view().insertAdjacentHTML("beforeend", html); }
      trimDom();
      syncEmpty();
      syncCount();
      if (follow) scrollBottom();
    }
    function renderAll() {
      const html = buf.filter(matchEntry).map(rowHTML).join("");
      view().innerHTML = html;
      syncEmpty();
      syncCount();
      if (follow) scrollBottom();
    }

    /* ───────── 暂停 / 清空 / 导出 ───────── */
    function syncPause() {
      $("#pause-ic").innerHTML = paused ? PLAY_IC : PAUSE_IC;
      $("#pause-label").textContent = paused ? "恢复" : "暂停";
      const st = $("#log-state");
      st.hidden = !paused;
      st.textContent = "已暂停" + (pending.length ? " · 挂起 " + pending.length + " 条" : "");
    }
    function togglePause() {
      paused = !paused;
      if (!paused && pending.length) { const p = pending; pending = []; appendEntries(p); }
      syncPause();
    }
    function clearLog() {
      // 只清缓冲与视图；seen 保留，避免把仍活跃的连接当成「新出现」再记一遍
      buf = []; pending = [];
      view().innerHTML = "";
      follow = true;
      $("#log-jump").hidden = true;
      syncEmpty(); syncCount(); syncPause();
    }
    function stamp() {
      const d = new Date();
      return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "-" +
             pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
    }
    function exportLog() {
      const rows = buf.filter(matchEntry);
      if (!rows.length) { toast("当前没有可导出的日志行", { variant: "danger" }); return; }
      const head = [
        "# VPN 管理网关 · 连接记录",
        "# 导出于 " + new Date().toLocaleString(),
        "# 共 " + rows.length + " 行 · 缓冲 " + buf.length + "/" + MAX_LINES + " · 筛选 " + filterDesc(),
        "",
      ];
      const text = head.concat(rows.map(e => e.ts + "  " + e.text)).join("\n") + "\n";
      const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = "vpn-router-" + stamp() + ".log";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("已导出 " + rows.length + " 行日志", { variant: "success" });
    }

    /* ───────── 出口下拉：随通道列表变化重建，保留当前选中 ───────── */
    function syncChanFilter() {
      const sig = chs.map(c => c.id + ":" + c.name).join("|");
      if (sig === chanSig) return;
      chanSig = sig;
      const sel = $("#f-chan");
      const cur = sel.value || "all";
      sel.innerHTML =
        '<option value="all">全部通道</option>' +
        '<option value="direct">DIRECT 兜底直连</option>' +
        chs.map(c => '<option value="ch-' + fb.esc(c.id) + '">ch-' + fb.esc(c.id) + " · " + fb.esc(c.name) + "</option>").join("");
      const has = Array.from(sel.options).some(o => o.value === cur);
      sel.value = has ? cur : "all";
      if (!has) { readFilters(); renderAll(); }
    }

    /* ───────── 指标带 ───────── */
    function rateParts(kb) {
      return kb >= 1024 ? [(kb / 1024).toFixed(1), "MB/s"] : [String(Math.round(kb)), "KB/s"];
    }
    function renderMetrics(up, down, conn) {
      const u = rateParts(up), d = rateParts(down);
      $("#m-up").textContent = u[0];   $("#m-up-u").textContent = u[1];
      $("#m-down").textContent = d[0]; $("#m-down-u").textContent = d[1];
      $("#m-conn").textContent = conn;
      const aliveN = nodes.filter(p => p.alive).length;
      $("#m-nodes").textContent = aliveN;
      $("#m-nodes-u").textContent = "/ " + nodes.length;
      // 指针:0 节点在线指最左(0deg 基准为竖直向上,-90 起点),全在线指最右(+90)
      const ratio = nodes.length ? aliveN / nodes.length : 0;
      $("#m-needle").style.transform = `rotate(${ratio * 180}deg)`;
    }

    /* ───────── tick：拉真实遥测 → 差分出新连接 → 合成日志行 ───────── */
    async function tick() {
      let data;
      try {
        [chs, data, nodes] = await Promise.all([
          api.channels(), api.connections(), api.proxies().then(r => r.proxies || []),
        ]);
      } catch (e) {
        // 失败:轮询会每 1.5s 自动重试,但给用户可见的离线指示 + 一条(只一条)友好错误条
        const firstFail = !feedDown;
        setFeed("down", "数据离线 · 重试中");
        showFeedError(e, () => { tick(); });
        if (firstFail)
          toast("遥测数据加载失败,将自动重试", { variant: "danger", action: { label: "立即重试", onClick: () => tick() } });
        return;
      }
      // 成功:更新「更新于」时间戳 + 清掉可能存在的故障错误条(自愈)
      if (!booted) { booted = true; view().innerHTML = ""; }
      clearFeedError();
      setFeed("live", "更新于 " + nowHHMMSS());
      $("#nav-count").textContent = chs.length;
      syncChanFilter();

      // 速率 = 总量差分 / 时间差；累计值变小 = mihomo 重载/重启归零，本帧不计差分（避免负值突刺）
      const now = Date.now();
      let up = 0, down = 0;
      if (prevTotals && prevTs) {
        const dt = (now - prevTs) / 1000 || 1;
        const dUp = data.uploadTotal - prevTotals.up, dDown = data.downloadTotal - prevTotals.down;
        up = dUp >= 0 ? dUp / dt / 1024 : 0;
        down = dDown >= 0 ? dDown / dt / 1024 : 0;
      }
      prevTotals = { up: data.uploadTotal, down: data.downloadTotal }; prevTs = now;

      const list = data.connections || [];
      renderMetrics(up, down, list.length);

      // 差分：本帧活跃 id 里没被记过的就是新连接；随后把 seen 换成本帧活跃集合
      const live = new Set();
      const fresh = [];
      list.forEach(c => {
        const id = String(c.id == null ? "" : c.id);
        if (!id) return;
        live.add(id);
        if (!seen.has(id)) fresh.push(c);
      });
      seen = live;
      if (!fresh.length) { syncEmpty(); return; }
      fresh.sort((a, b) => String(a.start || "").localeCompare(String(b.start || "")));
      const entries = fresh.map(makeEntry);
      if (paused) {
        pending = pending.concat(entries).slice(-MAX_LINES);
        syncPause();
      } else {
        appendEntries(entries);
      }
    }

    /* ───────── 事件绑定 ───────── */
    $("#f-chan").addEventListener("change", () => { readFilters(); renderAll(); });
    $("#f-re").addEventListener("input", () => { readFilters(); renderAll(); });
    $("#btn-pause").addEventListener("click", togglePause);
    $("#btn-clear").addEventListener("click", clearLog);
    $("#btn-export").addEventListener("click", exportLog);
    $("#log-jump").addEventListener("click", () => {
      follow = true;
      $("#log-jump").hidden = true;
      scrollBottom();
    });
    // 用户上滚即脱离跟随；滚回底部自动恢复跟随
    $("#log-view").addEventListener("scroll", () => {
      const v = view();
      const atBottom = v.scrollHeight - v.scrollTop - v.clientHeight < 24;
      follow = atBottom;
      $("#log-jump").hidden = atBottom;
    });

    syncPause();
    boot();
  </script>
</body>
</html>
