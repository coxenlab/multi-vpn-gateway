<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分流规则 · VPN 管理网关</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* 屏内独有:流量干线图 + 规则健康控制带 + 扁平规则表,全部由 var(--*) 派生 */
    .grp-name { font-weight: 600; }
    .grp-name:hover { color: var(--accent); }
    .grp-meta { color: var(--muted); font-size: var(--text-xs); font-family: var(--font-mono); }
    tr.hit-conflict td { background: var(--danger-soft); }
    tr.off td { color: var(--muted); }
    .note-conflict { color: var(--danger); font-size: var(--text-xs); }
    /* 语义色已是浅底深档,再混白会掉出 4.5:1,一律用本色 */
    .note-dead { color: var(--warn); font-size: var(--text-xs); }
    .routing-health { display: flex; align-items: center; gap: var(--space-5); padding: var(--space-4) var(--space-5); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .health-title { min-width: 190px; }
    .health-title strong { display: block; margin-top: 2px; font-size: var(--text-base); }
    .health-metrics { display: flex; align-items: center; gap: var(--space-5); flex: 1; flex-wrap: wrap; }
    .health-metric { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: var(--text-xs); }
    .health-metric b { color: var(--fg); font-family: var(--font-mono); font-size: var(--text-sm); }
    .health-metric.issue.active b { color: var(--danger); }
    .routing-health.has-issues { border-color: color-mix(in oklab, var(--warn), transparent 45%); }
    .routing-health.has-issues .health-title strong { color: var(--warn); }
    .issue-drawer, .diag-drawer { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
    .issue-drawer > summary, .diag-drawer > summary { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); cursor: pointer; list-style: none; font-weight: 600; }
    .issue-drawer > summary::-webkit-details-marker, .diag-drawer > summary::-webkit-details-marker { display: none; }
    .issue-drawer > summary::after, .diag-drawer > summary::after { content: "展开"; margin-left: auto; color: var(--muted); font-size: var(--text-xs); font-weight: 500; }
    .issue-drawer[open] > summary::after, .diag-drawer[open] > summary::after { content: "收起"; }
    .issue-list { border-top: 1px solid var(--border); padding: var(--space-2) var(--space-5) var(--space-4); }
    .issue-item { display: flex; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--border); font-size: var(--text-sm); line-height: 1.55; }
    .issue-item:last-child { border-bottom: 0; }
    .issue-item .badge { align-self: flex-start; }
    .rule-toolbar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .rule-search { flex: 1; min-width: 220px; max-width: 440px; }
    .channel-filter { width: 200px; }
    .bulk-actions { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; }
    .bulk-count { color: var(--muted); font-size: var(--text-xs); min-width: 52px; text-align: right; }
    .rule-pattern { font-family: var(--font-mono); font-weight: 500; }
    .rule-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .rule-badge { display: inline-flex; padding: 2px 7px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; white-space: nowrap; }
    .rule-badge.conflict { color: var(--danger); background: var(--danger-soft); }
    .rule-badge.dead { color: var(--warn); background: var(--warn-soft); }
    .rule-badge.paused { color: var(--muted); background: var(--surface-2); }
    .rule-note-input { min-width: 150px; height: 32px; padding: 5px 8px; font-size: var(--text-xs); }
    .rule-lock { min-width: 58px; }
    .rule-lock svg { width: 14px; height: 14px; }
    /* 浅底:关态轨道是中灰(surface-2 太浅,白拨钮会看不出来),拨钮两态都是白 */
    .switch { position: relative; width: 38px; height: 22px; border-radius: var(--radius-pill); background: color-mix(in oklab, var(--muted), transparent 55%); border: 1px solid transparent; padding: 0; transition: background var(--motion-fast); }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--elev-raised); transition: left var(--motion-fast) var(--ease-standard), background var(--motion-fast); }
    .switch.on { background: var(--success); border-color: var(--success); }
    .switch.on::after { left: 18px; background: var(--surface); }
    .switch:disabled { cursor: wait; opacity: .6; }
    .rule-check { width: 16px; height: 16px; accent-color: var(--accent); }
    .diag-body { border-top: 1px solid var(--border); padding: var(--space-5); }
    /* 穿透图:节点链 = flex 行,每跳一个节点 + 状态灯 */
    .pipe { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 2px 0; }
    .pipe-node { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; background: var(--surface); flex: none; }
    .pipe-node .pn { font-size: var(--text-sm); font-weight: 500; line-height: 1.3; white-space: nowrap; }
    .pipe-node .ps { font-size: var(--text-xs); color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
    .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .pdot.ok { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    .pdot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
    .pdot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    .pipe-arrow { color: var(--muted); flex: none; font-family: var(--font-mono); font-size: var(--text-sm); }
    .pipe-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
    .pipe-row:first-child { border-top: none; }
    .pipe-ch { width: 150px; flex: none; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .pipe-row.dim .pipe-node { opacity: 0.55; }
    .entry-pipe { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    @media (max-width: 900px) {
      .routing-health { align-items: flex-start; flex-direction: column; gap: var(--space-3); }
      .health-title { min-width: 0; }
      .rule-search, .channel-filter { max-width: none; width: 100%; }
      .bulk-actions { width: 100%; margin-left: 0; }
      .bulk-count { margin-left: auto; }
      .pipe-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .pipe-ch { width: auto; flex-direction: row; align-items: center; gap: 10px; }
    }
  </style>
</head>
<body data-page="routing">
  <div class="app">
    <aside class="sidebar"></aside>

    <!-- ════ 主区 ════ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>分流规则</h1>
        <span class="spacer"></span>
        <button class="btn btn-secondary btn-sm" id="global-routing" type="button" role="switch" aria-checked="true" hidden>分流总开关 · 开</button>
      </header>

      <div class="content stack-6">
        <div class="banner" id="config-application" style="display:none;" role="status">
          <div style="flex:1;min-width:0;">
            <div class="bt" id="config-application-title"></div>
            <p id="config-application-detail"></p>
          </div>
          <button class="btn btn-secondary btn-sm" id="config-retry" type="button">重试同步</button>
        </div>
        <!-- 一行状态摘要：只在规则异常时展开下方问题清单 -->
        <div class="routing-health" id="routing-health" data-od-id="routing-health">
          <div class="health-title">
            <span class="eyebrow">规则健康</span>
            <strong id="health-title">正在检查…</strong>
          </div>
          <div class="health-metrics">
            <span class="health-metric">在线通道 <b id="summary-online">—</b></span>
            <span class="health-metric">设置启用 <b id="summary-enabled">—</b></span>
            <span class="health-metric issue">规则交叠 <b id="summary-conflict">—</b></span>
            <span class="health-metric">随通道停用 <b id="summary-dead">—</b></span>
          </div>
        </div>
        <details class="issue-drawer" id="issue-details" style="display:none;">
          <summary><span>问题清单</span></summary>
          <div class="issue-list" id="issues"></div>
        </details>

        <!-- 扁平规则运维表 -->
        <div class="card" data-od-id="master-table">
          <div class="card-head">
            <h3>全部规则</h3>
            <span class="t-sm muted"><span class="num" id="t-visible">—</span> / <span class="num" id="t-rules">—</span> 条</span>
          </div>
          <div class="rule-toolbar">
            <input class="input rule-search" id="rule-search" type="search" placeholder="搜索规则或通道" aria-label="搜索分流规则" />
            <select class="select channel-filter" id="channel-filter" aria-label="按通道筛选">
              <option value="">全部通道</option>
            </select>
            <div class="bulk-actions">
              <span class="bulk-count" id="bulk-count">未选择</span>
              <button class="btn btn-secondary btn-sm" id="bulk-enable" disabled>批量启用</button>
              <button class="btn btn-secondary btn-sm" id="bulk-disable" disabled>批量停用</button>
            </div>
          </div>
          <div style="overflow-x:auto;">
            <table class="table">
              <thead>
                <tr>
                  <th><input class="rule-check" id="select-visible" type="checkbox" aria-label="选择当前筛选结果" /></th>
                  <th>规则</th>
                  <th>类型</th>
                  <th>所属通道</th>
                  <th>通道状态</th>
                  <th class="desktop-routing" hidden>备注</th>
                  <th>启停</th>
                  <th class="desktop-routing" hidden>保护</th>
                  <th>问题</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="card-body" id="table-fallback" style="display:none;"></div>
        </div>

        <!-- 链路诊断降为按需展开，不与规则运维争首屏 -->
        <details class="diag-drawer" id="diag-drawer" data-od-id="pipe-map">
          <summary><span>链路诊断</span><span class="t-xs muted">通道不通时，看是哪一环断了</span></summary>
          <div class="diag-body">
            <div class="pipe entry-pipe" id="entry-pipe">
              <div class="pipe-node"><span class="pdot"></span><div><div class="pn">检测中…</div><div class="ps">正在读取入口接管状态</div></div></div>
            </div>
            <div id="pipe-rows"></div>
          </div>
        </details>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/routing-table.js"></script>
</body>
</html>
