<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>容器状态 · VPN 管理网关</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* 屏内独有:容器状态灯 + 角色说明,全部由 var(--*) 派生 */
    .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 7px; flex: none; vertical-align: 1px; }
    .cdot.ok { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    .cdot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
    .cdot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    .role-sub { color: var(--muted); font-size: var(--text-xs); margin-top: 2px; }
    .st-sub { font-size: var(--text-xs); margin-top: 2px; color: var(--muted); }
    .st-sub.bad { color: var(--danger); }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    tr.crash td { background: var(--danger-soft); }
    tr.orphan-row td { background: var(--warn-soft); }
    .stat-tile.alert .stat-num { color: var(--danger); }
    .stat-tile.mind .stat-num { color: var(--warn); }
  </style>
</head>
<body data-page="system">
  <div class="app">
    <aside class="sidebar"></aside>

    <!-- ════ 主区 ════ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="icon-btn hide-mobile" href="clash-config.html?tab=diag" aria-label="返回设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1>容器状态</h1>
        <span class="spacer"></span>
      </header>

      <div class="content stack-6">
        <!-- 概览统计 -->
        <div class="grid-4" id="stats" data-od-id="containers-stats">
          <div class="stat-tile">
            <div class="stat-label">容器</div>
            <div class="stat-num" id="s-total">—</div>
            
          </div>
          <div class="stat-tile ok">
            <div class="stat-label">运行中</div>
            <div class="stat-num" id="s-running">—</div>
            
          </div>
          <div class="stat-tile" id="tile-bad">
            <div class="stat-label">异常</div>
            <div class="stat-num" id="s-bad">—</div>
            <div class="stat-foot">反复重启或异常退出</div>
          </div>
          <div class="stat-tile" id="tile-orphan">
            <div class="stat-label">残留</div>
            <div class="stat-num" id="s-orphan">—</div>
            <div class="stat-foot">通道已删除后留下的容器</div>
          </div>
        </div>

        <!-- 容器总表 -->
        <div class="card" data-od-id="containers-table">
          <div class="card-head">
            <h3>全部容器</h3>
            <span class="t-sm muted" id="t-sum">—</span>
          </div>
          <div style="overflow-x:auto;">
            <table class="table">
              <thead>
                <tr>
                  <th>容器</th>
                  <th>角色 · 所属</th>
                  <th>状态</th>
                  <th class="hide-sm">镜像</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="card-body" id="table-fallback" style="display:none;"></div>
        </div>

        <!-- 日志查看（点某行「日志」后出现） -->
        <div class="card" id="logs-card" style="display:none;" data-od-id="containers-logs">
          <div class="card-body">
            <div class="code-head">
              <span id="logs-title">docker logs</span>
              <button class="btn btn-sm btn-ghost" id="logs-refresh" style="color:var(--on-ink);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/></svg>
                刷新
              </button>
            </div>
            <div class="code" id="logs-body" style="max-height:50vh; overflow:auto;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/containers.js"></script>
</body>
</html>
