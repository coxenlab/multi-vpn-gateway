<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新建通道 · VPN 管理网关</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* 屏内独有样式 —— 仅用 var(--*) */
    .step-panel { display: none; }
    .step-panel.active { display: block; animation: fb-fade-in var(--motion-base, 200ms) var(--ease-standard, ease); }
    @media (prefers-reduced-motion: reduce) { .step-panel.active { animation: none; } }
    .stepper-wrap { overflow-x: auto; padding-bottom: 2px; }
    .choice.disabled { opacity: .45; pointer-events: none; }
    .vnc-placeholder {
      width: 100%; min-height: 320px; display: grid; place-items: center;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md);
      color: var(--muted); font-size: var(--text-sm);
    }
    /* 登录步骤底部的连通状态行:唯一判据 = 后端探活 */
    .conn-line { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-2); font-size: var(--text-sm); }
    .conn-line.ok { border-color: color-mix(in oklab, var(--success), transparent 60%); background: var(--success-soft); color: var(--success); }
  </style>
</head>
<body data-page="channels">
  <div class="app">
    <aside class="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>新建通道</h1>
        <span class="spacer"></span>
        <a class="btn btn-ghost hide-mobile" href="index.html">返回</a>
      </header>

      <div class="content content-narrow stack-6">
        <div class="card card-pad stepper-wrap" data-od-id="stepper">
          <div class="stepper" id="stepper">
            <div class="step active" data-step="1"><span class="snum">1</span><span class="lbl">通道信息</span></div>
            <div class="bar"></div>
            <div class="step" data-step="2"><span class="snum">2</span><span class="lbl">登录</span></div>
            <div class="bar"></div>
            <div class="step" data-step="3"><span class="snum">3</span><span class="lbl">分流规则</span></div>
          </div>
        </div>

        <!-- ① 通道信息 -->
        <section class="step-panel active" data-panel="1" data-od-id="panel-info">
          <div class="card">
            <div class="card-head"><h3>通道信息</h3></div>
            <div class="card-body stack-6">
              <form class="form-grid" id="ch-form" onsubmit="return false;">
                <div class="field col-span">
                  <label>客户名称 <span class="req">*</span></label>
                  <input class="input" id="f-name" placeholder="如：维度 CRM" autocomplete="off" />
                </div>

                <div class="field col-span">
                  <label>VPN 类型 <span class="req">*</span></label>
                  <div class="choice-grid" id="type-grid">
                    <label class="choice sel" data-type="easyconnect"><div class="ct">EasyConnect</div><div class="cd">深信服</div></label>
                    <label class="choice" data-type="atrust"><div class="ct">aTrust</div><div class="cd">深信服</div></label>
                  </div>
                  <div id="types-err" style="margin-top:var(--space-3);"></div>
                </div>

                <div class="field" id="ecver-field" style="display:none;">
                  <label>客户端版本</label>
                  <select class="select" id="f-ecver"></select>
                </div>

                <div class="field" id="login-field">
                  <label>登录方式 <span class="req">*</span></label>
                  <div class="choice-grid" id="login-grid">
                    <label class="choice sel" data-login="password"><div class="ct">账号密码自动登录</div><div class="cd">填好账号密码，连接时自动登录</div></label>
                    <label class="choice" data-login="interactive"><div class="ct">在登录窗口手动登录</div><div class="cd">需要短信验证码、扫码或 SSO 时选这个</div></label>
                  </div>
                </div>

                <div id="dyn-fields"></div>

                <div class="field col-span">
                  <label>内网验证地址 <span class="req">*</span></label>
                  <input class="input mono" id="f-probe" placeholder="http://crm.internal/login" autocomplete="off" />
                  <span class="help">一个只有连上这条 VPN 才打得开的内网网址，用来判断是否已连通。</span>
                </div>
              </form>
              <div id="type-notice"></div>
              <div id="pf-wrap" style="display:none;">
                <div class="row-between" style="margin-bottom:var(--space-2);">
                  <strong>环境检查未通过</strong>
                  <span class="row" style="gap:var(--space-2);">
                    <button class="btn btn-secondary btn-sm" id="pf-recheck" type="button">重新检查</button>
                    <button class="btn btn-ghost btn-sm" id="pf-skip" type="button">仍然继续</button>
                  </span>
                </div>
                <div id="pf-host"></div>
              </div>
              <div id="create-steps"></div>
              <div id="create-err"></div>
            </div>
            <div class="card-foot" style="justify-content:flex-end;">
              <a class="btn btn-secondary" href="index.html">取消</a>
              <button class="btn btn-primary" id="create-btn">创建通道</button>
            </div>
          </div>
        </section>

        <!-- ② 登录 -->
        <section class="step-panel" data-panel="2" data-od-id="panel-login">
          <div class="card">
            <div class="card-head"><h3>登录</h3><span id="login-badge" class="badge is-running"><i class="bdot"></i>待登录</span></div>
            <div class="card-body stack-4">
              <div id="login-interactive" class="stack-4">
                <div id="vnc-placeholder" class="vnc-placeholder">正在打开登录窗口…</div>
                <div id="vnc-err"></div>
                <p class="t-xs muted">在上方窗口里像平时一样登录客户的 VPN。登录完成后这里会自动检测连通，无需手动操作。
                  <a href="#" id="vnc-reload-wiz">窗口没出来？重新打开</a></p>
              </div>
              <div id="login-headless" style="display:none;">
                <p class="t-sm muted">已用填写的账号密码自动登录，正在连接…</p>
              </div>
              <div class="conn-line" id="conn-line"><span id="conn-spin"></span><span id="conn-text">等待登录…</span></div>
            </div>
            <div class="card-foot row-between">
              <span class="t-xs muted" id="conn-hint"></span>
              <button class="btn btn-primary" id="go-3">下一步：绑定分流规则</button>
            </div>
          </div>
        </section>

        <!-- ③ 分流规则 -->
        <section class="step-panel" data-panel="3" data-od-id="panel-bind">
          <div class="card" id="bind-card">
            <div class="card-head"><h3>分流规则</h3><span class="t-xs muted">命中的域名或 IP 走这条通道，其余流量不受影响</span></div>
            <div class="card-body stack-4">
              <form class="row" id="bind-form" style="gap:var(--space-3);" onsubmit="return false;">
                <input class="input mono grow" id="f-domain" placeholder="crm.example.com  10.20.0.0/16  可一次粘多个" autocomplete="off" />
                <button class="btn btn-primary" id="bind-btn" type="submit">绑定</button>
              </form>
              <div class="ch-domains" id="bound-list"><span class="t-sm muted">还没有规则，可以稍后在通道详情里补。</span></div>
              <div id="bind-err"></div>
            </div>
            <div class="card-foot" style="justify-content:flex-end; gap:var(--space-2);">
              <a class="btn btn-secondary" href="clash-config.html">去设置接入方式</a>
              <a class="btn btn-primary" id="done-link" href="index.html">完成</a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/new-channel.js"></script>
</body>
</html>
