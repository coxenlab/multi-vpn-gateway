<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>通道 · VPN 管理网关</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-page="channels">
  <div class="app">
    <aside class="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>通道</h1>
        <span class="spacer"></span>
        <a class="btn btn-primary" href="new-channel.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          新建通道
        </a>
      </header>

      <div class="content stack-6">
        <div class="grid-4" id="stats" data-od-id="overview">
          <div class="stat-tile">
            <div class="stat-label">通道</div>
            <div class="stat-num" id="s-total">—</div>
          </div>
          <div class="stat-tile ok">
            <div class="stat-label">已连接</div>
            <div class="stat-num" id="s-ok">—</div>
          </div>
          <div class="stat-tile">
            <div class="stat-label">待登录</div>
            <div class="stat-num" id="s-wait">—</div>
          </div>
          <div class="stat-tile">
            <div class="stat-label">分流规则</div>
            <div class="stat-num" id="s-dom">—</div>
          </div>
        </div>

        <div data-od-id="channel-list-section">
          <div class="grid-2" id="channel-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/index.js"></script>
</body>
</html>
